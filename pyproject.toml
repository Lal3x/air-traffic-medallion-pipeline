[project]
name = "brazil-air-traffic-beam"
version = "0.1.0"
description = "Pipeline de dados para monitoramento do tráfego aéreo sobre a região de São Paulo utilizando Apache Beam e arquitetura medalhão."
authors = [
    {name = "Lucas Alexandre", email = "174282100+Lal3x@users.noreply.github.com"}
]
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "apache-beam[aws] (>=2.73,<3.0)",
    "requests (>=2.34.2,<3.0.0)",
    "tenacity (>=9.1.4,<10.0.0)",
    "pydantic-settings (>=2.15.0,<3.0.0)",
    "python-dotenv (>=1.2.3,<2.0.0)",
    "pyyaml (>=6.0.3,<7.0.0)",
    "pyarrow (>=25.0.1,<26.0.0)",
    "duckdb (>=1.5.5,<2.0.0)",
    "structlog (>=26.1.0,<27.0.0)",
    "streamlit (>=1.45.0,<2.0.0)",
    "pandas (>=2.2.0,<3.0.0)"
]

[tool.poetry]
packages = [
    {include = "air_traffic_beam", from = "src"},
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.1.1,<10.0.0)",
    "pytest-cov (>=7.1.0,<8.0.0)",
    "pytest-mock (>=3.15.1,<4.0.0)",
    "requests-mock (>=1.12.1,<2.0.0)",
    "ruff (>=0.16.7,<0.17.0)",
    "mypy (>=2.3.1,<3.0.0)",
    "pre-commit (>=4.6.2,<5.0.0)",
    "taskipy (>=1.14.1,<2.0.0)",
    "mkdocs (>=1.6.1,<2.0.0)",
    "mkdocs-material (>=9.7.7,<10.0.0)"
]

[tool.mypy]
ignore_missing_imports = true

[tool.ruff.lint]
extend-select = ["I"]

[tool.taskipy.tasks]
test = "task tests"
tests = "poetry run pytest tests -v --cov=air_traffic_beam --cov-report=term-missing --cov-report=xml --cov-fail-under=70"
lint = "poetry run ruff check . && poetry run ruff format --check ."
format = "poetry run ruff check --select I --fix . && poetry run ruff format ."
format-check = "poetry run ruff format --check ."
types = "poetry run mypy src"
docs = "poetry run mkdocs build --strict"
check = "task lint && task types && task tests"
pre-commit-install = "poetry run pre-commit install"
