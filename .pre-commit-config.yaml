default_language_version:
  python: python3.13

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.7
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml
        exclude: ^mkdocs\.yml$
      - id: check-yaml
        name: check MkDocs YAML syntax
        files: ^mkdocs\.yml$
        args: [--unsafe]
      - id: check-toml
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-merge-conflict

  - repo: local
    hooks:
      - id: pytest
        name: pytest with coverage (minimum 70%)
        entry: poetry run task tests
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]
